server.port=-1
management.server.port=8086

SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

spring.kafka.consumer.group-id=email-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topic=${APP_KAFKA_TOPIC:notification-events}
app.kafka.retry.max-attempts=3
app.kafka.retry.backoff-ms=2000

spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
SPRING_MAIL_USERNAME=bedcc19bd4f5e4
SPRING_MAIL_PASSWORD=f82f3cb6cd0678
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=noreply@notification-service.local
app.mail.subject-prefix=[Notification Process]

logging.level.com.notificationapp=DEBUG
logging.level.org.springframework.kafka=INFO

# Expose the prometheus actuator endpoint along with health and info
management.endpoints.web.exposure.include=configprops,health,info,prometheus
management.endpoint.configprops.show-values=ALWAYS
# Show detailed health status
management.endpoint.health.show-details=always

# Explicitly enable the prometheus endpoint
management.endpoint.prometheus.enabled=true

# Add an application label to all exported metrics for easier filtering
management.metrics.tags.application=notification-generator