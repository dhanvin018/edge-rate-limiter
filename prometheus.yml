global:
  scrape_interval: 5s     # Collect metrics every 5 seconds
  evaluation_interval: 5s # Evaluate alert rules every 5 seconds

scrape_configs:
  - job_name: 'event-posting-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eventposting:8085'] # Compose service name and server.port
  - job_name: 'notification-generator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'notification-generator:8086' ] # management.server.port
  # --- Community Exporters ---
  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis-exporter:9121' ]