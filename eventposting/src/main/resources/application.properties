# Enable dynamic port allocation for integration tests
server.port=0

# Select rate limiter config source: 'yaml' or 'properties'
rate-limiter.config-source=yaml
spring.config.import=optional:classpath:Config/fixed-window.yml

#Kafka Configuration
KAFKA_BOOTSTRAP_SERVERS=localhost:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

server.tomcat.threads.max=200

# Redis Connection Details
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=your_password_here  # Uncomment if auth is required

# Connection Pool Settings (Requires commons-pool2 dependency)
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.timeout=2000ms

# PostgreSQL Settings
spring.datasource.url=jdbc:postgresql://localhost:5433/ratelimiter_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable or disable JWT authentication across the application
authentication.required=false
# Password encoder configuration bean
jwt.secret=1PGgvQSz+mzNTWQRPDkwC4nF89MCTpcGbg8/wqwKNeU=

management.endpoints.web.exposure.include=configprops,health
management.endpoint.configprops.show-values=ALWAYS

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration