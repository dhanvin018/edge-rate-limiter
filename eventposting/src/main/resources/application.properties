server.port=8085

rate-limiter.config-source=yaml
spring.config.import=optional:classpath:Config/fixed-window.yml

# Kafka Service Reference
KAFKA_BOOTSTRAP_SERVERS=kafka:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

server.tomcat.threads.max=200

# Redis Service Reference
REDIS_HOST=redis
REDIS_PORT=6379
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.timeout=2000ms

# PostgreSQL Service Reference
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/appdb}
SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/appdb
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

authentication.required=false
rate-limiting.required=true
jwt.secret=1PGgvQSz+mzNTWQRPDkwC4nF89MCTpcGbg8/wqwKNeU=

# Expose the prometheus actuator endpoint along with health and info
management.endpoints.web.exposure.include=configprops,health,info,prometheus
management.endpoint.configprops.show-values=ALWAYS
# Show detailed health status
management.endpoint.health.show-details=always

# Explicitly enable the prometheus endpoint
management.endpoint.prometheus.enabled=true

# Add an application label to all exported metrics for easier filtering
management.metrics.tags.application=event-posting-service


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
